<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Campus Cafe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1 id="site-title">Campus Cafe</h1>
        <p class="tagline">Fresh coffee for busy students</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="index.html#about">About</a>
            <a href="index.html#menu">Menu</a>
            <a href="index.html#hours">Hours</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Contact Us</h2>

            <form action="#" method="post">

                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="number">Phone Number:</label>
                <input type="number" id="number" name="number">

                <label for="date">Preferred Date:</label>
                <input type="date" id="date" name="date">

                <p>Order Type:</p>

                <input type="radio" id="pickup" name="order-type" value="pickup">
                <label for="pickup">Pickup</label>

                <input type="radio" id="dinein" name="order-type" value="dine-in">
                <label for="dinein">Dine in</label>

                <p>Extras:</p>

                <input type="checkbox" id="sugar" name="extras" value="sugar">
                <label for="sugar">Extra Sugar</label>

                <input type="checkbox" id="milk" name="extras" value="milk">
                <label for="milk">Extra Milk</label>

                <label for="drink">Favorite Drink:</label>
                <select id="drink" name="drink">
                    <option value="espresso">Espresso</option>
                    <option value="latte">Iced Latte</option>
                    <option value="tea">Tea</option>
                </select>

                <label for="msg">Message:</label>
                <textarea id="msg" name="msg" rows="6"></textarea>

                <button type="submit">Send</button>

            </form>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 Campus Cafe</p>
    </footer>

</body>

</html>
